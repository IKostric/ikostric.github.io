name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main   # Build site on push to main branch
  workflow_dispatch:

permissions:
  contents: read   # To clone the repository
  pages: write     # Not required by this method, but safe to include
  id-token: write  # Not required by this method

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true    # If you use Hugo modules

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.136.5'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Generate Pagefind search index
        run: npx pagefind --site "public"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
